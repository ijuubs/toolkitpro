    <script>
      (function() {
        var isCrossOrBenign = function(msg, url) {
          if (!msg) return true;
          var s = String(msg);
          if (
            s === 'Script error.' ||
            s === 'Script error' ||
            s.indexOf('Script error') !== -1 ||
            s.indexOf('ResizeObserver') !== -1 ||
            s.indexOf('websocket') !== -1 ||
            s.indexOf('adsbygoogle') !== -1 ||
            s.indexOf('googletagmanager') !== -1 ||
            s.indexOf('SecurityError') !== -1
          ) {
            return true;
          }
          if (url) {
            var u = String(url);
            if (
              u.indexOf('googletagmanager') !== -1 ||
              u.indexOf('googlesyndication') !== -1 ||
              u.indexOf('google-analytics') !== -1 ||
              u.indexOf('doubleclick') !== -1
            ) {
              return true;
            }
          }
          return false;
        };

        window.addEventListener('error', function(e) {
          if (isCrossOrBenign(e.message, e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (isCrossOrBenign(msg, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.onerror = function(msg, url) {
          if (isCrossOrBenign(msg, url)) {
            return true;
          }
        };
      })();
    </script>

      (function() {
        try {
          // Clear any leftover storage keys from previous ad networks
          var cleanStorage = function(storage) {
            for (var i = storage.length - 1; i >= 0; i--) {
              var key = storage.key(i);
              if (key && (/adsterra|monetag|quge|3nbf4|_as_|bluntutil/i.test(key))) {
                storage.removeItem(key);
              }
            }
          };
          cleanStorage(localStorage);
          cleanStorage(sessionStorage);

          // Delete any IndexedDB databases created by previous malicious ad networks
          if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
              for (var i = 0; i < dbs.length; i++) {
                if (dbs[i].name && /adsterra|monetag|push/i.test(dbs[i].name)) {
                  indexedDB.deleteDatabase(dbs[i].name);
                }
              }
            }).catch(function() {});
          }

          // Link Accessibility Enhancer (Ensures third-party injected links like CookieHub have descriptive accessible labels)
          var enhanceLinks = function() {
            var links = document.querySelectorAll('a');
            for (var i = 0; i < links.length; i++) {
              var a = links[i];
              var txt = (a.innerText || a.textContent || '').trim().toLowerCase();
              var href = (a.getAttribute('href') || '').toLowerCase();
              
              if (txt === 'learn more' || txt === 'learn more.' || txt === 'more') {
                if (href.indexOf('cookiehub') !== -1 || href.indexOf('about-cookies') !== -1) {
                  a.setAttribute('aria-label', 'Learn more about cookies on CookieHub');
                  a.setAttribute('title', 'Learn more about CookieHub cookie management');
                } else if (href.indexOf('privacy') !== -1) {
                  a.setAttribute('aria-label', 'Learn more about our Privacy Policy');
                } else if (href.indexOf('terms') !== -1) {
                  a.setAttribute('aria-label', 'Learn more about our Terms of Service');
                } else {
                  a.setAttribute('aria-label', 'Learn more about ToolKitPro services and utilities');
                }
              } else if (href.indexOf('cookiehub.com') !== -1 || href.indexOf('/about-cookies') !== -1) {
                if (!a.getAttribute('aria-label')) {
                  a.setAttribute('aria-label', 'Read more about CookieHub cookie policy');
                }
              }
            }
          };

          if (typeof MutationObserver !== 'undefined') {
            var observer = new MutationObserver(function() {
              enhanceLinks();
            });
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
          window.addEventListener('DOMContentLoaded', enhanceLinks);
        } catch (e) {}
      })();
    </script>

        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-MXB9J8GM');

        // 3. AdSense (Production only)

          adsense.async = true;

          document.body.appendChild(adsense);
        }
      };

      // Load on first user interaction or idle callback
      const triggerEvents = ['scroll', 'mousemove', 'mousedown', 'keydown', 'touchstart'];
      const onUserInteraction = () => {
        loadThirdPartyScripts();
        triggerEvents.forEach(e => window.removeEventListener(e, onUserInteraction, {passive: true}));
      };
      
      triggerEvents.forEach(e => window.addEventListener(e, onUserInteraction, {passive: true}));
      
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => setTimeout(loadThirdPartyScripts, 2500));
      } else {
        setTimeout(loadThirdPartyScripts, 3000);
      }
