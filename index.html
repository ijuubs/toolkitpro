    <script>
      // Delay heavy 3rd-party scripts to improve Core Web Vitals (LCP/TBT)
      let adsLoaded = false;
      const loadAds = () => {
        if (adsLoaded) return;
        adsLoaded = true;

        // AdSense
        const adsense = document.createElement("script");
        adsense.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6659085318131236";
        adsense.async = true;
        adsense.crossOrigin = "anonymous";
        document.body.appendChild(adsense);
      };

      // Load on interaction or after 3 seconds
      const events = ['scroll', 'mousemove', 'mousedown', 'keydown', 'touchstart'];
      const triggerAds = () => {
        loadAds();
        events.forEach(e => window.removeEventListener(e, triggerAds, {passive: true}));
      };
      
      events.forEach(e => window.addEventListener(e, triggerAds, {passive: true}));
      setTimeout(loadAds, 3000);
    </script>
