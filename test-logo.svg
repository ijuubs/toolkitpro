<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <rect width="1000" height="240" fill="#000000"/>
  <g transform="translate(40, 20)">
    <!-- Yellow Speed Stripes -->
    <path d="M 0 105 L 45 90 L 15 110 Z" fill="#FACC15"/>
    <path d="M 10 165 L 75 140 L 40 175 Z" fill="#FACC15"/>
    <path d="M 160 30 L 260 -5 L 235 25 Z" fill="#FACC15"/>
    <path d="M 175 185 L 275 150 L 245 190 Z" fill="#FACC15"/>
    
    <!-- Diagonal yellow accent lines behind box -->
    <polygon points="-20,110 30,95 20,110 -30,125" fill="#FACC15"/>
    <polygon points="-10,180 50,160 38,175 -20,195" fill="#FACC15"/>
    <polygon points="170,30 260,0 245,15 160,45" fill="#FACC15"/>
    <polygon points="180,180 270,150 250,168 165,198" fill="#FACC15"/>

    <!-- Handle -->
    <path d="M 68 55 C 68 25, 142 25, 142 55" fill="none" stroke="#FACC15" stroke-width="18" stroke-linecap="round"/>
    <path d="M 68 55 C 68 25, 142 25, 142 55" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

    <!-- Toolbox Body Base Shape (Black thick border) -->
    <polygon points="35,95 85,55 175,55 205,90 205,175 165,205 75,205 35,175" fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Lid Top Panel (White) -->
    <polygon points="38,92 85,58 172,58 128,92" fill="#FFFFFF"/>
    <!-- Lid Right Panel (Yellow/Dark) -->
    <polygon points="172,58 200,90 156,92 128,92" fill="#EAB308"/>

    <!-- Front Left Face (White) with cutout for gear -->
    <polygon points="38,98 125,98 125,125 90,125 70,160 90,195 125,195 125,200 75,200 38,172" fill="#FFFFFF"/>

    <!-- Front Right Face (Yellow side) -->
    <polygon points="128,98 198,98 198,172 162,198 128,198" fill="#FACC15"/>

    <!-- Central Lock / Clasp -->
    <rect x="118" y="80" width="18" height="24" rx="4" fill="#FACC15" stroke="#000000" stroke-width="4"/>

    <!-- The Gear inside the cutout -->
    <g transform="translate(130, 155)">
      <!-- Gear Teeth -->
      <path d="
        M -12 -38 L 12 -38 L 9 -28 L -9 -28 Z
        M -12 38 L 12 38 L 9 28 L -9 28 Z
        M -38 -12 L -38 12 L -28 9 L -28 -9 Z
        M 38 -12 L 38 12 L 28 9 L 28 -9 Z
        M -27 -27 L -10 -35 L -10 -23 L -21 -15 Z
        M 27 27 L 10 35 L 10 23 L 21 15 Z
        M -27 27 L -35 10 L -23 10 L -15 21 Z
        M 27 -27 L 35 -10 L 23 -10 L 15 -21 Z
      " fill="#FACC15" stroke="#000000" stroke-width="4"/>
      <!-- Gear Outer Circle -->
      <circle cx="0" cy="0" r="30" fill="#FACC15" stroke="#000000" stroke-width="5"/>
      <!-- Gear Inner Hole -->
      <circle cx="0" cy="0" r="14" fill="#000000"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="310" y="155" font-family="'Liberation Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="112" letter-spacing="-2">
    <tspan fill="#FFFFFF">Toolkit</tspan><tspan fill="#FACC15">Pro</tspan>
  </text>
</svg>
